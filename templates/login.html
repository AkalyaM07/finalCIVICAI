<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CivicAI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .login-logo .logo-icon {
            width: 38px;
            height: 38px;
            font-size: 19px;
        }

        .login-logo span {
            font-size: 24px;
            font-weight: 750;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h1 {
            font-size: 32px;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 13px;
        }

        .role-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #edf4f2;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .role-toggle button {
            border: none;
            background: transparent;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 650;
            color: var(--text-light);
            font-family: inherit;
            font-size: 13px;
        }

        .role-toggle button.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .selected-role {
            text-align: center;
            color: var(--text-light);
            font-size: 12px;
            margin-bottom: 22px;
        }

        .selected-role strong {
            color: var(--primary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .login-form label {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }

        .login-form input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            font-size: 13px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            border-color: var(--primary);
        }

        .login-button {
            margin-top: 8px;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: var(--primary-dark);
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: var(--text-light);
            font-size: 12px;
        }

        .signup-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<main class="login-page">


    <div class="login-card">


        <div class="login-logo">

            <div class="logo-icon">
                C
            </div>

            <span>
                Civic<span class="logo-ai">AI</span>
            </span>

        </div>


        <div class="login-header">

            <div class="section-label">
                CIVICAI ACCESS
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue to CivicAI.
            </p>

        </div>


        <!-- ROLE SELECTION -->

        <div class="role-toggle">

            <button
                type="button"
                id="userButton"
                class="active"
                onclick="selectRole('user')">

                👤 Citizen

            </button>


            <button
                type="button"
                id="adminButton"
                onclick="selectRole('admin')">

                🏢 Admin

            </button>

        </div>


        <div class="selected-role">

            Login as
            <strong id="selectedRole">
                Citizen
            </strong>

        </div>


        <!-- LOGIN FORM -->

        <form
            class="login-form"
            action="/login"
            method="POST"
        >


            <input
                type="hidden"
                id="role"
                name="role"
                value="user"
            >


            <div>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div>

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Login →

            </button>


        </form>


        <!-- SIGNUP LINK -->

        <div class="signup-text">

            Don't have an account?

            <a
                id="signupLink"
                href="/signup?role=user">

                Sign Up

            </a>

        </div>


    </div>


</main>


<script>

function selectRole(role) {

    const roleInput =
        document.getElementById("role");

    const userButton =
        document.getElementById("userButton");

    const adminButton =
        document.getElementById("adminButton");

    const selectedRole =
        document.getElementById("selectedRole");

    const signupLink =
        document.getElementById("signupLink");


    roleInput.value = role;


    if (role === "user") {

        userButton.classList.add("active");

        adminButton.classList.remove("active");

        selectedRole.textContent = "Citizen";

        signupLink.href = "/signup?role=user";

    }


    else {

        adminButton.classList.add("active");

        userButton.classList.remove("active");

        selectedRole.textContent = "Admin";

        signupLink.href = "/signup?role=admin";

    }

}

</script>


</body>

</html>
